spring:
  mvc:
    contentnegotiation:
      defaultcontenttype: application/json
  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    test-while-idle: true
    test-on-borrow: true
    validation-query: SELECT 1
  sql:
    init:
      mode: always
      platform: mysql
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT}

security:
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl: 90000
    refresh-token-ttl: 604800000

sms:
  provider: ${SMS_PROVIDER}
  infobip:
    api-key: ${INFOBIP_API_KEY}
    base-url: ${INFOBIP_BASE_URL}
otp:
  expiration-minutes: 60
  max-attempts-per-day: 10
  resend-cooldown-seconds: 60
storage:
  local:
    base-directory: ${LOCAL_STORAGE_BASE_DIRECTORY:./storage}
  provider: ${STORAGE_PROVIDER:local}