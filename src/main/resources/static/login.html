<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập hệ thống Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl p-10">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg">
                <i class="fa-solid fa-hotel text-white text-2xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-slate-800">Motel Admin</h1>
            <p class="text-slate-500 text-sm">Đăng nhập để quản trị hệ thống</p>
        </div>

        <!-- Alert hiển thị lỗi bằng JS -->
        <div id="errorAlert" class="hidden mb-6 p-4 bg-red-50 border border-red-100 rounded-xl flex items-center gap-3 text-red-600">
            <i class="fa-solid fa-circle-exclamation"></i>
            <p class="text-sm font-semibold" id="errorMessage">Tài khoản hoặc mật khẩu không đúng!</p>
        </div>

        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase mb-2 ml-1">Số điện thoại / Username</label>
                <input type="text" name="username" id="username" required
                       class="w-full px-4 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all font-medium text-slate-700"
                       placeholder="Nhập tài khoản">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase mb-2 ml-1">Mật khẩu</label>
                <input type="password" name="password" id="password" required
                       class="w-full px-4 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all font-medium text-slate-700"
                       placeholder="••••••••">
            </div>

            <button type="submit" 
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-2xl shadow-lg transition-all flex items-center justify-center gap-2 mt-4">
                <span>ĐĂNG NHẬP</span>
                <i class="fa-solid fa-arrow-right-to-bracket text-sm"></i>
            </button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new URLSearchParams();
            formData.append('username', document.getElementById('username').value);
            formData.append('password', document.getElementById('password').value);

            try {
                // Gửi yêu cầu POST đến endpoint mặc định của Spring Security
                const response = await fetch('/admin/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: formData,
                    redirect: 'manual' // Chặn tự động chuyển hướng để check status
                });

                if (response.type === 'opaqueredirect' || response.status === 200 || response.redirected) {
                    // Nếu thành công, chuyển hướng đến trang user
                    window.location.href = '/admin/users';
                } else {
                    showError("Đăng nhập thất bại. Vui lòng kiểm tra lại!");
                }
            } catch (error) {
                window.location.href = '/admin/users';
            }
        });

        function showError(msg) {
            const alert = document.getElementById('errorAlert');
            document.getElementById('errorMessage').innerText = msg;
            alert.classList.remove('hidden');
        }
    </script>
</body>
</html>
