<!-- users.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Users Management</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
</head>

<body class="bg-gray-100">

<div class="flex min-h-screen">

    <!-- SIDEBAR -->
    <aside class="w-84 bg-gray-900 text-white flex flex-col">

        <div class="p-6 border-b border-gray-800">

            <h1 class="text-2xl font-bold">
                Admin Dashboard
            </h1>

        </div>

        <nav class="flex-1 p-4 space-y-2">

            <a href="/admin/users"
               class="flex items-center gap-3 px-4 py-3 rounded-xl bg-gray-800">

                <i class="fa-solid fa-users"></i>

                <span>Quản lí người dùng</span>

            </a>

            <a href="/admin/motels"
               class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gray-800 transition">

                <i class="fa-solid fa-building"></i>

                <span>Quản lí danh sách nhà trọ</span>

            </a>

        </nav>

    </aside>

    <!-- MAIN -->
    <main class="flex-1 overflow-auto">

        <!-- TOPBAR -->
        <div class="bg-white shadow px-8 py-5 flex justify-between items-center">

            <div>

                <h2 class="text-3xl font-bold">
                    Quản lí người dùng
                </h2>

            </div>

            <button onclick="openCreateModal()"
                    class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-3 rounded-xl">

                <i class="fa-solid fa-plus mr-2"></i>

                Tạo tài khoản mới

            </button>

        </div>

        <!-- CONTENT -->
        <div class="p-8">

            <!-- FILTER -->
            <div class="bg-white rounded-2xl shadow p-4 mb-6 flex gap-4">

                <div class="relative">

                    <i class="fa-solid fa-magnifying-glass absolute left-4 top-4 text-gray-400"></i>

                    <input id="filterInput"
                           type="text"
                           placeholder="Tìm kiếm theo tên hoặc số điện thoại..."
                           class="border rounded-xl pl-11 pr-4 py-3 w-80"/>

                </div>

                <button onclick="loadUsers()"
                        class="bg-gray-900 text-white px-5 py-3 rounded-xl">

                    Lọc

                </button>

            </div>

            <!-- TABLE -->
            <div class="bg-white rounded-2xl shadow overflow-hidden">

                <table class="w-full">

                    <thead class="bg-gray-100">

                    <tr>

                        <th class="p-5 text-left">Ảnh đại diện</th>
                        <th class="p-5 text-left">Họ tên</th>
                        <th class="p-5 text-left">Số điện thoại</th>
                        <th class="p-5 text-left">Vai trò</th>
                        <th class="p-5 text-left">Xác thực</th>
                        <th class="p-5 text-left">Hành động</th>

                    </tr>

                    </thead>

                    <tbody id="usersTable"></tbody>

                </table>

                <!-- PAGINATION -->
                <div class="flex justify-between items-center px-6 py-5 border-t">

                    <div id="paginationInfo"
                         class="text-gray-500"></div>

                    <div class="flex gap-3">

                        <button onclick="prevPage()"
                                class="bg-gray-200 hover:bg-gray-300 px-4 py-2 rounded-lg">

                            <i class="fa-solid fa-chevron-left"></i>

                        </button>

                        <button onclick="nextPage()"
                                class="bg-gray-200 hover:bg-gray-300 px-4 py-2 rounded-lg">

                            <i class="fa-solid fa-chevron-right"></i>

                        </button>

                    </div>

                </div>

            </div>

        </div>

    </main>

</div>

<!-- USER INFO MODAL -->
<div id="userModal"
     class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50">

    <div class="bg-white rounded-2xl w-[500px] p-6">

        <div class="flex justify-between items-center mb-6">

            <h2 class="text-2xl font-bold">
                Thông tin người dùng
            </h2>

            <button onclick="closeUserModal()">

                <i class="fa-solid fa-xmark text-xl"></i>

            </button>

        </div>

        <div id="userInfoContent"></div>

    </div>

</div>

<!-- CREATE USER MODAL -->
<div id="createModal"
     class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50">

    <div class="bg-white rounded-2xl w-[650px] p-6">

        <div class="flex justify-between items-center mb-6">

            <h2 class="text-2xl font-bold">
                Tạo tài khoản mới
            </h2>

            <button onclick="closeCreateModal()">

                <i class="fa-solid fa-xmark text-xl"></i>

            </button>

        </div>

        <div class="grid grid-cols-2 gap-4">

            <input id="phoneNumber"
                   type="text"
                   placeholder="Số điện thoại"
                   class="border rounded-xl px-4 py-3"/>

            <input id="fullName"
                   type="text"
                   placeholder="Họ tên"
                   class="border rounded-xl px-4 py-3"/>

            <select id="gender"
                    class="border rounded-xl px-4 py-3">

                <option value="0">Nam</option>
                <option value="1">Nữ</option>
                <option value="2">Khác</option>

            </select>

            <select id="role"
                    class="border rounded-xl px-4 py-3">

                <option value="0">Chủ trọ</option>
                <option value="1">Người thuê</option>

            </select>

            <input id="password"
                   type="password"
                   placeholder="Mật khẩu"
                   class="border rounded-xl px-4 py-3 col-span-2"/>

            <label class="flex items-center gap-2">

                <input id="isVerified"
                       type="checkbox"
                       checked/>

                Xác thực ngay

            </label>

        </div>

        <div class="flex justify-end mt-6">

            <button onclick="createUser()"
                    class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-xl">

                Create User

            </button>

        </div>

    </div>

</div>

<script>

let currentPage = 0;
let totalPages = 0;

async function loadUsers() {

    const filter = document.getElementById("filterInput").value;

    const response = await fetch(
        `/api/admin/users?page=${currentPage}&size=10&filterNumber=${filter}`
    );

    const data = (await response.json()).data;

    totalPages = data.totalPages;

    document.getElementById("paginationInfo").innerText =
        `Trang ${currentPage + 1} / ${totalPages}`;

    const tbody = document.getElementById("usersTable");

    tbody.innerHTML = "";

    data.content.forEach(user => {

        tbody.innerHTML += `
            <tr class="border-t hover:bg-gray-50">

                <td class="p-5">

                    <img src="${user.avatarUrl ?  "/api/media/"+user.avatarUrl : 'https://ui-avatars.com/api/?background=0D8ABC&color=fff&name='+user.fullName.split(" ").join("+")}"
                         class="w-14 h-14 rounded-full object-cover"/>

                </td>

                <td class="p-5 font-semibold">
                    ${user.fullName}
                </td>

                <td class="p-5">
                    ${user.phoneNumber}
                </td>

                <td class="p-5">
                    ${user.role === 'TENANT' ? 'Người thuê' : 'Chủ trọ'}
                </td> 

                <td class="p-5">

                    ${
                        user.isVerified
                        ? '<span class="bg-green-100 text-green-700 px-3 py-1 rounded-full text-sm">Đã xác thực</span>'
                        : '<span class="bg-red-100 text-red-700 px-3 py-1 rounded-full text-sm">Chưa xác thực</span>'
                    }

                </td>

                <td class="p-5 flex gap-2 flex-wrap">

                    <button onclick='showUserInfo(${JSON.stringify(user)})'
                            class="bg-gray-800 hover:bg-gray-700 text-white px-3 py-2 rounded-lg">

                        <i class="fa-solid fa-eye"></i>

                    </button>

                    ${
                        user.role === "LANDLORD"
                        ? `
                            <a href="/admin/motels?landlordId=${user.id}"
                               class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded-lg min-w-[40px] justify-center">

                                <i class="fa-solid fa-building"></i>

                            </a>
                        `
                        : `
                            <button onclick="viewJoinedMotel('${user.id}')"
                                    class="bg-purple-600 hover:bg-purple-700 text-white px-3 py-2 rounded-lg min-w-[40px] justify-center">

                                <i class="fa-solid fa-house"></i>

                            </button>
                        `
                    }

                    ${
                        !user.isVerified
                        ? `
                            <button onclick="verifyUser('${user.id}')"
                                    class="bg-green-600 hover:bg-green-700 text-white px-3 py-2 rounded-lg">

                                <i class="fa-solid fa-check"></i>

                            </button>
                        `
                        : ''
                    }

                </td>

            </tr>
        `;
    });
}

function nextPage() {

    if (currentPage + 1 >= totalPages) return;

    currentPage++;

    loadUsers();
}

function prevPage() {

    if (currentPage === 0) return;

    currentPage--;

    loadUsers();
}

function showUserInfo(user) {

    document.getElementById("userInfoContent").innerHTML = `
        <div class="flex flex-col items-center">

            <img src="${user.avatarUrl ?  "/api/media/"+user.avatarUrl : 'https://ui-avatars.com/api/?background=0D8ABC&color=fff&name='+user.fullName.split(" ").join("+")}"
                 class="w-28 h-28 rounded-full mb-5 object-cover"/>

            <div class="space-y-3 w-full">

                <div>
                    <span class="font-semibold">Họ tên:</span>
                    ${user.fullName}
                </div>

                <div>
                    <span class="font-semibold">Số điện thoại:</span>
                    ${user.phoneNumber}
                </div>

                <div>
                    <span class="font-semibold">Vai trò:</span>
                    ${user.role === 'TENANT' ? 'Người thuê' : 'Chủ trọ'}
                </div>

                <div>
                    <span class="font-semibold">Giới tính:</span>
                    ${user.gender === 0 ? 'Nam' : user.gender === 1 ? 'Nữ' : 'Khác'}
                </div>

                <div>
                    <span class="font-semibold">Trạng thái:</span>
                    ${user.isVerified}
                </div>

            </div>

        </div>
    `;

    document.getElementById("userModal").classList.remove("hidden");
    document.getElementById("userModal").classList.add("flex");
}

function closeUserModal() {

    document.getElementById("userModal").classList.add("hidden");
}

function openCreateModal() {

    document.getElementById("createModal").classList.remove("hidden");
    document.getElementById("createModal").classList.add("flex");
}

function closeCreateModal() {

    document.getElementById("createModal").classList.add("hidden");
}

async function createUser() {

    const body = {
        phoneNumber: document.getElementById("phoneNumber").value,
        fullName: document.getElementById("fullName").value,
        gender: Number(document.getElementById("gender").value),
        password: document.getElementById("password").value,
        role: Number(document.getElementById("role").value),
        isVerified: document.getElementById("isVerified").checked
    };

    await fetch("/api/admin/users", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(body)
    });

    closeCreateModal();

    loadUsers();
}

async function verifyUser(userId) {

    await fetch(`/api/admin/users/${userId}/verify?userId=${userId}`, {
        method: "PATCH"
    });

    loadUsers();
}

async function viewJoinedMotel(userId) {

    const response = await fetch(`/api/admin/motels/joined?tenantId=${userId}`);

    const motel = (await response.json()).data;

    window.location.href = `/admin/motel/${motel.id}`;
}

loadUsers();

</script>

</body>
</html>
