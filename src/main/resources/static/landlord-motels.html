<!-- landlord-motels.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Landlord Motels</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
</head>

<body class="bg-gray-100">

<div class="flex min-h-screen">

    <!-- SIDEBAR -->
    <aside class="w-84 bg-gray-900 text-white flex flex-col">

        <div class="p-6 border-b border-gray-800">

            <h1 class="text-2xl font-bold">
                Admin Dashboard
            </h1>

        </div>

        <nav class="flex-1 p-4 space-y-2">

            <a href="/admin/users"
               class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gray-800">

                <i class="fa-solid fa-users"></i>

                <span>Quản lí người dùng</span>

            </a>

            <a href="/admin/motels"
               class="flex items-center gap-3 px-4 py-3 rounded-xl bg-gray-800">

                <i class="fa-solid fa-building"></i>

                <span>Quản lí danh sách nhà trọ</span>

            </a>

        </nav>

    </aside>

    <!-- MAIN -->
    <main class="flex-1 overflow-auto">

        <div class="bg-white shadow px-8 py-5 flex justify-between items-center">

            <div>

                <h2 class="text-3xl font-bold">
                    Danh sách nhà trọ của chủ trọ
                </h2>

            </div>

            <button onclick="window.history.back()"
                    class="bg-gray-900 hover:bg-gray-800 text-white px-5 py-3 rounded-xl">

                Quay lại
            </button>

        </div>

        <div class="p-8">

            <div id="motelsGrid"
                 class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>

        </div>

    </main>

</div>

<script>

async function loadMotels() {

    const params = new URLSearchParams(window.location.search);

    const landlordId = params.get("landlordId");

    const response = await fetch(`/api/admin/motels?landlordId=${landlordId}`);

    const motels = (await response.json()).data;

    const grid = document.getElementById("motelsGrid");

    grid.innerHTML = "";

    motels.forEach(motel => {

        grid.innerHTML += `
            <a href="/admin/motel/${motel.id}"
               class="bg-white rounded-2xl shadow hover:shadow-xl transition p-6 block">

                <div class="flex justify-between items-start mb-5">

                    <div>

                        <h2 class="text-2xl font-bold">
                            ${motel.name}
                        </h2>

                        <p class="text-gray-500 mt-2">
                            ${motel.memberCount} thành viên đang ở
                        </p>

                    </div>

                    <div class="w-14 h-14 rounded-2xl bg-blue-100 flex items-center justify-center">

                        <i class="fa-solid fa-building text-blue-600 text-xl"></i>

                    </div>

                </div>

                <div class="text-blue-600 font-semibold">

                    Xem chi tiết

                    <i class="fa-solid fa-arrow-right ml-2"></i>

                </div>

            </a>
        `;
    });
}

loadMotels();

</script>

</body>
</html>
