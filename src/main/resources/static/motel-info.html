<!-- motel-info.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Motel Information</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
</head>

<body class="bg-gray-100">

<div class="flex min-h-screen">

    <!-- SIDEBAR -->
    <aside class="w-84 bg-gray-900 text-white flex flex-col">

        <div class="p-6 border-b border-gray-800">

            <h1 class="text-2xl font-bold">
                Admin Dashboard
            </h1>

        </div>

        <nav class="flex-1 p-4 space-y-2">

            <a href="/admin/users"
               class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gray-800">

                <i class="fa-solid fa-users"></i>

                <span>Quản lí người dùng</span>

            </a>

            <a href="/admin/motels"
               class="flex items-center gap-3 px-4 py-3 rounded-xl bg-gray-800">

                <i class="fa-solid fa-building"></i>

                <span>Quản lí danh sách nhà trọ</span>

            </a>

        </nav>

    </aside>

    <!-- MAIN -->
    <main class="flex-1 overflow-auto">

        <!-- TOPBAR -->
        <div class="bg-white shadow px-8 py-5 flex justify-between items-center">

            <div>

                <h2 id="motelName"
                    class="text-3xl font-bold"></h2>

                <p class="text-gray-500 mt-1">
                    Thông tin chi tiết về nhà trọ
                </p>

            </div>

            <button onclick="window.history.back()"
                    class="bg-gray-900 hover:bg-gray-800 text-white px-5 py-3 rounded-xl">

                Quay lại
            </button>
        </div>

        <!-- CONTENT -->
        <div class="p-8">

            <!-- LANDLORD -->
            <div class="bg-white rounded-2xl shadow p-6 mb-6">

                <div class="flex items-center justify-between mb-6">

                    <h3 class="text-2xl font-bold">
                        Thông tin chủ trọ
                    </h3>

                    <div class="w-14 h-14 rounded-2xl bg-blue-100 flex items-center justify-center">

                        <i class="fa-solid fa-user-tie text-blue-600 text-xl"></i>

                    </div>

                </div>

                <div id="landlordInfo"></div>

            </div>

            <!-- TABS -->
            <div class="bg-white rounded-2xl shadow overflow-hidden">

                <!-- TAB HEADER -->
                <div class="flex border-b">

                    <button onclick="switchTab('members')"
                            id="membersBtn"
                            class="px-6 py-4 font-semibold border-b-2 border-blue-600 text-blue-600">

                        <i class="fa-solid fa-users mr-2"></i>

                        Danh sách thành viên

                    </button>

                    <button onclick="switchTab('rooms')"
                            id="roomsBtn"
                            class="px-6 py-4 font-semibold text-gray-500">

                        <i class="fa-solid fa-door-open mr-2"></i>

                        Danh sách phòng

                    </button>

                </div>

                <!-- MEMBERS -->
                <div id="membersTab"
                     class="p-6">

                    <table class="w-full">

                        <thead>

                        <tr class="border-b">

                            <th class="p-4 text-left">Họ tên</th>
                            <th class="p-4 text-left">Số điện thoại</th>
                            <th class="p-4 text-left">Sô phòng</th>
                            <th class="p-4 text-left">Ngày tham gia</th>

                        </tr>

                        </thead>

                        <tbody id="membersTable"></tbody>

                    </table>

                </div>

                <!-- ROOMS -->
                <div id="roomsTab"
                     class="p-6 hidden">

                    <table class="w-full">

                        <thead>

                        <tr class="border-b">

                            <th class="p-4 text-left">Số phòng</th>
                            <th class="p-4 text-left">Giá tiền</th>
                            <th class="p-4 text-left">Số thành viên</th>

                        </tr>

                        </thead>

                        <tbody id="roomsTable"></tbody>

                    </table>

                </div>

            </div>

        </div>

    </main>

</div>

<script>

const motelId = window.location.pathname.split("/").pop();

async function loadMotel() {

    const motelRes = await fetch(`/api/admin/motels/${motelId}`);

    const motel = (await motelRes.json()).data;

    document.getElementById("motelName").innerText = motel.name;

    const landlordRes = await fetch(`/api/admin/motels/${motelId}/landlord`);

    const landlord = (await landlordRes.json()).data;

    document.getElementById("landlordInfo").innerHTML = `
        <div class="flex items-center gap-5">

            <img src="${landlord.avatarUrl ?  "/api/media/"+landlord.avatarUrl : 'https://ui-avatars.com/api/?background=0D8ABC&color=fff?name='+landlord.fullName.split(" ").join("+")}"
                 class="w-28 h-28 rounded-full object-cover"/>

            <div>

                <h3 class="text-2xl font-bold">
                    ${landlord.fullName}
                </h3>

                <p class="text-gray-500 mt-2">
                    ${landlord.phoneNumber}
                </p>

                <div class="mt-3 inline-block bg-blue-100 text-blue-700 px-4 py-1 rounded-full text-sm">

                    ${landlord.role}

                </div>

            </div>

        </div>
    `;

    loadMembers();
    loadRooms();
}

async function loadMembers() {

    const response = await fetch(`/api/admin/motels/${motelId}/members`);

    const members = (await response.json()).data;

    const tbody = document.getElementById("membersTable");

    tbody.innerHTML = "";

    members.forEach(member => {

        tbody.innerHTML += `
            <tr class="border-b hover:bg-gray-50">

                <td class="p-4">
                    ${member.user.fullName}
                </td>

                <td class="p-4">
                    ${member.user.phoneNumber}
                </td>

                <td class="p-4">
                    ${member.roomNumber}
                </td>

                <td class="p-4">
                    ${member.joinDate}
                </td>

            </tr>
        `;
    });
}

async function loadRooms() {

    const response = await fetch(`/api/admin/motels/${motelId}/rooms`);

    const rooms = (await response.json()).data;

    const tbody = document.getElementById("roomsTable");

    tbody.innerHTML = "";

    rooms.forEach(room => {

        tbody.innerHTML += `
            <tr class="border-b hover:bg-gray-50">

                <td class="p-4 font-semibold">
                    ${room.roomNumber}
                </td>

                <td class="p-4">
                    ${room.price}
                </td>

                <td class="p-4">
                    ${room.memberCount}
                </td>

            </tr>
        `;
    });
}

function switchTab(tab) {

    document.getElementById("membersTab")
        .classList.add("hidden");

    document.getElementById("roomsTab")
        .classList.add("hidden");

    document.getElementById("membersBtn")
        .classList.remove("border-blue-600", "text-blue-600");

    document.getElementById("roomsBtn")
        .classList.remove("border-blue-600", "text-blue-600");

    if (tab === "members") {

        document.getElementById("membersTab")
            .classList.remove("hidden");

        document.getElementById("membersBtn")
            .classList.add("border-blue-600", "text-blue-600");

    } else {

        document.getElementById("roomsTab")
            .classList.remove("hidden");

        document.getElementById("roomsBtn")
            .classList.add("border-blue-600", "text-blue-600");
    }
}

loadMotel();

</script>

</body>
</html>
