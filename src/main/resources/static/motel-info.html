<!doctype html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chi tiết nhà trọ | Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
    <style>
        .tab-active {
            border-bottom: 3px solid #2563eb;
            color: #2563eb;
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .avatar-circle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            text-transform: uppercase;
        }
    </style>
</head>

<body class="bg-gray-50 flex min-h-screen font-sans text-gray-900">
    <!-- Sidebar -->
    <aside class="w-64 bg-slate-900 text-white fixed h-full p-6 z-40 hidden md:block">
        <h1 class="text-xl font-bold text-blue-400 mb-10">MOTEL ADMIN</h1>
        <nav class="space-y-4">
            <a href="/admin/users" class="flex items-center gap-3 p-3 hover:bg-slate-800 rounded-lg transition">
                <i class="fa-solid fa-people-roof text-gray-400"></i> Người dùng
            </a>
            <a href="/admin/motels" class="flex items-center gap-3 p-3 bg-blue-600 rounded-lg shadow-lg shadow-blue-900/20">
                <i class="fa-solid fa-hotel"></i> Nhà trọ
            </a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="md:ml-64 flex-1 p-4 md:p-8">
        <!-- Header & Breadcrumbs -->
        <nav class="flex text-xs text-gray-400 mb-4 gap-2 font-bold uppercase tracking-wider">
            <a href="/admin/motels" class="hover:text-blue-600">Quản lý trọ</a>
            <span>/</span>
            <span class="text-gray-600">Thông tin chi tiết</span>
        </nav>

        <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-6 mb-8">
            <div>
                <h2 id="motelName" class="text-4xl font-black text-slate-800 tracking-tight">Đang tải tên trọ...</h2>
                <div class="flex items-center gap-2 mt-2 text-gray-500">
                    <i class="fa-solid fa-location-dot text-red-400"></i>
                    <span id="motelAddress" class="text-sm font-medium italic">Đang tải địa chỉ...</span>
                </div>
            </div>
            
            <!-- Landlord Profile Card -->
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-4 min-w-[300px]">
                <div class="w-12 h-12 bg-blue-100 text-blue-600 rounded-xl flex items-center justify-center text-xl shadow-inner">
                    <i class="fa-solid fa-user-tie"></i>
                </div>
                <div>
                    <p class="text-[10px] font-black text-gray-400 uppercase leading-none mb-1">Chủ nhà trọ</p>
                    <h4 id="landlordName" class="text-lg font-bold text-slate-800 leading-tight">...</h4>
                    <div class="flex items-center gap-2 text-sm text-blue-600 font-bold mt-0.5">
                        <i class="fa-solid fa-phone text-[10px]"></i>
                        <span id="landlordPhoneNumber">...</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- TABS Navigation -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="flex border-b px-6 bg-gray-50/50">
                <button onclick="switchTab('members')" id="tab-members" class="tab-active py-5 px-6 text-sm font-black transition-all flex items-center gap-2">
                    <i class="fa-solid fa-users-viewfinder"></i> THÀNH VIÊN
                </button>
                <button onclick="switchTab('rooms')" id="tab-rooms" class="py-5 px-6 text-sm font-black text-gray-400 hover:text-blue-600 transition-all flex items-center gap-2 border-transparent">
                    <i class="fa-solid fa-border-all"></i> DANH SÁCH PHÒNG
                </button>
            </div>

            <!-- Tab Content: Members -->
            <div id="content-members" class="tab-content active overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-white border-b">
                        <tr>
                            <th class="px-6 py-4 text-[11px] font-black text-gray-400 uppercase tracking-widest">Thành viên cư trú</th>
                            <th class="px-6 py-4 text-[11px] font-black text-gray-400 uppercase tracking-widest text-center">Số phòng</th>
                            <th class="px-6 py-4 text-[11px] font-black text-gray-400 uppercase tracking-widest">Ngày dọn vào</th>
                        </tr>
                    </thead>
                    <tbody id="memberTableBody" class="divide-y divide-gray-50">
                        <!-- Data injected here -->
                    </tbody>
                </table>
            </div>

            <!-- Tab Content: Rooms -->
            <div id="content-rooms" class="tab-content p-6">
                <div id="roomGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6">
                    <!-- Data injected here -->
                </div>
            </div>
        </div>
    </main>

    <script>
        const pathSegments = window.location.pathname.split('/');
        const motelId = pathSegments[pathSegments.length - 1];

        const colors = ['bg-blue-500', 'bg-purple-500', 'bg-emerald-500', 'bg-orange-500', 'bg-pink-500', 'bg-indigo-500'];
        const getRandomColor = () => colors[Math.floor(Math.random() * colors.length)];

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('[id^="tab-"]').forEach(t => {
                t.classList.remove('tab-active');
                t.classList.add('text-gray-400', 'border-transparent');
                t.classList.remove('text-blue-600');
            });

            document.getElementById(`content-${tab}`).classList.add('active');
            const activeBtn = document.getElementById(`tab-${tab}`);
            activeBtn.classList.add('tab-active');
            activeBtn.classList.remove('text-gray-400');
        }

        async function fetchMotelInfo() {
            try {
                const [res, res2] = await Promise.all([
                    fetch(`/api/admin/motels/${motelId}`),
                    fetch(`/api/admin/motels/${motelId}/landlord`)
                ]);
                const motelInfo = (await res.json()).data;
                const landlordData = (await res2.json()).data;

                document.getElementById('motelName').innerText = motelInfo.name;
                document.getElementById('motelAddress').innerText = motelInfo.address || "Địa chỉ chưa cập nhật";
                document.getElementById('landlordName').innerText = landlordData.fullName;
                document.getElementById('landlordPhoneNumber').innerText = landlordData.phoneNumber;
            } catch (e) { console.error("Lỗi tải info", e); }
        }

        async function fetchMembers() {
            const tbody = document.getElementById('memberTableBody');
            tbody.innerHTML = '<tr><td colspan="3" class="text-center py-20 text-gray-400"><i class="fas fa-circle-notch animate-spin text-2xl mb-2"></i><br/>Đang truy xuất dữ liệu...</td></tr>';
            
            try {
                const res = await fetch(`/api/admin/motels/${motelId}/members`);
                const members = (await res.json()).data;

                if(members.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="3" class="text-center py-20 text-gray-400 font-medium italic">Chưa có thành viên nào cư trú.</td></tr>';
                    return;
                }

                tbody.innerHTML = members.map(m => `
                    <tr class="hover:bg-blue-50/30 transition duration-200">
                        <td class="px-6 py-4">
                            <div class="flex items-center gap-4">
                                <div class="avatar-circle ${getRandomColor()} shadow-sm">
                                    ${m.user.fullName.charAt(0)}
                                </div>
                                <div>
                                    <div class="font-black text-slate-700 text-sm">${m.user.fullName}</div>
                                    <div class="text-[11px] text-gray-400 font-bold tracking-tight">${m.user.phoneNumber}</div>
                                </div>
                            </div>
                        </td>
                        <td class="px-6 py-4 text-center">
                            <span class="px-3 py-1 bg-slate-100 text-slate-600 rounded-lg font-black text-xs border border-slate-200">
                                P.${m.roomNumber}
                            </span>
                        </td>
                        <td class="px-6 py-4">
                            <div class="flex items-center gap-2 text-sm text-gray-500 font-medium">
                                <i class="fa-regular fa-calendar-check text-blue-400"></i>
                                ${new Date(m.joinDate).toLocaleDateString('vi-VN')}
                            </div>
                        </td>
                    </tr>
                `).join('');
            } catch (e) { tbody.innerHTML = '<tr><td colspan="3" class="text-center text-red-500 p-4">Lỗi kết nối máy chủ</td></tr>'; }
        }

        async function fetchRooms() {
            const grid = document.getElementById('roomGrid');
            try {
                const res = await fetch(`/api/admin/motels/${motelId}/rooms`);
                const rooms = (await res.json()).data;

                grid.innerHTML = rooms.map(r => `
                    <div class="relative bg-white border border-gray-100 rounded-2xl p-5 shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all duration-300 group overflow-hidden">
                        <!-- Phông nền ẩn hiệu ứng -->
                        <div class="absolute -right-4 -top-4 text-slate-50 text-6xl font-black group-hover:text-blue-50 transition-colors">
                            ${r.roomNumber}
                        </div>
                        
                        <div class="relative z-10">
                            <div class="flex justify-between items-center mb-4">
                                <div class="w-12 h-12 bg-slate-800 text-white rounded-xl flex items-center justify-center font-black text-lg shadow-lg shadow-slate-200">
                                    ${r.roomNumber}
                                </div>
                                <div class="h-2 w-2 rounded-full ${r.isOccupied ? 'bg-emerald-500 animate-pulse' : 'bg-gray-300'}"></div>
                            </div>
                            
                            <div class="space-y-1">
                                <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest leading-none">Giá thuê tháng</p>
                                <p class="text-xl font-black text-blue-600">
                                    ${new Intl.NumberFormat('vi-VN').format(r.price)}<span class="text-xs ml-0.5 text-gray-400 font-bold font-serif font-sans">đ</span>
                                </p>
                            </div>

                            <div class="mt-4 pt-4 border-t border-dashed border-gray-100 flex items-center justify-between">
                                <span class="text-[10px] font-bold text-gray-500 italic">
                                    <i class="fa-solid fa-expand mr-1"></i> Diện tích: -- m²
                                </span>
                                <i class="fa-solid fa-arrow-right-long text-gray-300 group-hover:text-blue-500 group-hover:translate-x-1 transition-all"></i>
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch (e) { grid.innerHTML = '<p class="text-gray-400 italic">Lỗi khi tải dữ liệu phòng</p>'; }
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchMotelInfo();
            fetchMembers();
            fetchRooms();
        });
    </script>
</body>
</html>
